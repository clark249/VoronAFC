[force_move]
enable_force_move: True

[AFC_extruder extruder]
pin_tool_start: buffer
tool_stn: 46.0                 # Reccomended 55              
tool_stn_unload: 145.0         # Reccomended 65 
tool_sensor_after_extruder: 0.0 
tool_unload_speed: 25           
tool_load_speed: 25             

#[filament_switch_sensor bypass]
#switch_pin: turtleneck:PB5
#pause_on_runout: False


[AFC_buffer Turtle_1]
advance_pin: ^Turtle_1:TN_ADV    # set advance pin
trailing_pin: ^Turtle_1:TN_TRL  # set trailing pin
filament_error_sensitivity: 0.0  # 0-10 scale, 0 disables
multiplier_high: 1.15   # default 1.05, factor to feed more filament
multiplier_low:  0.85   # default 0.95, factor to feed less filament
filament_error_sensitivity: 0