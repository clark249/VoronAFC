[gcode_shell_command backup_to_github]
command: bash /home/pi/klipper-backup/script.sh
timeout: 90.
verbose: True

[gcode_macro BACKUP_CFG]
description: Manually back up Klipper config files to GitHub
gcode:
    SET_DISPLAY_TEXT MSG="Backing up config to GitHub..."
    RUN_SHELL_COMMAND CMD=backup_to_github

# Automatically run backup 30 seconds after Klipper boots/restarts (including after SAVE_CONFIG)
[delayed_gcode AUTO_BACKUP_ON_BOOT]
initial_duration: 30.0
gcode:
    RUN_SHELL_COMMAND CMD=backup_to_github



