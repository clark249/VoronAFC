[gcode_macro MAINT]
description: Safely pause (if printing) and move toolhead up 60mm to front center for maintenance
gcode:
    # 1. Define your safe front-center X and Y maintenance coordinates
    {% set x_maint = 150.0 %}
    {% set y_maint = 15.0 %}

    # 2. Define Z lift and printer limits
    {% set z_lift = 60.0 %}
    {% set max_z = printer.toolhead.axis_maximum.z | float %}
    {% set current_z = printer.toolhead.position.z | float %}
    {% set target_z = [current_z + z_lift, max_z] | min %}

    # 3. Check if actively printing (and not already paused)
    {% if printer.virtual_sdcard.is_active and not printer.pause_resume.is_paused %}
        PAUSE                           ; Saves PAUSE_STATE, retracts, lifts 10mm, and parks
        G90                             ; Absolute positioning
        G1 Z{target_z} F1500            ; Lift further to 60mm above original print Z
        G1 X{x_maint} Y{y_maint} F6000  ; Bring toolhead to front-center for easy access

    {% elif printer.pause_resume.is_paused %}
        # Already paused: just move to maintenance spot without overwriting PAUSE_STATE
        G90
        G1 Z{target_z} F1500
        G1 X{x_maint} Y{y_maint} F6000

    {% else %}
        # IDLE PATH: Requires printer to be homed first
        {% if "xyz" in printer.toolhead.homed_axes %}
            G90
            G1 Z{target_z} F1500
            G1 X{x_maint} Y{y_maint} F6000
        {% else %}
            {action_raise_error("Printer must be homed first before moving to maintenance position!")}
        {% endif %}
    {% endif %}

