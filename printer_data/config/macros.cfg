#####################################################################################################################################

[gcode_shell_command backup_to_github]
command: bash /home/pi/klipper-backup/script.sh
timeout: 30.
verbose: True

[gcode_macro BACKUP_CFG]
gcode:
    RUN_SHELL_COMMAND CMD=backup_to_github

# Automatically run backup 15 seconds after Klipper boots/restarts (including after SAVE_CONFIG)
[delayed_gcode AUTO_BACKUP_ON_BOOT]
initial_duration: 15.0
gcode:
    RUN_SHELL_COMMAND CMD=backup_to_github


