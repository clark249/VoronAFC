#####################################################################################################################################

[gcode_macro CALIBRATE_SCAN]
description: Step 1 - Heat 350 bed to 100C safely at Z50, level gantry, and run Cartographer Scan calibration
gcode:
    {% set target_bed = params.BED|default(100)|int %}
    {% set x_center = printer.toolhead.axis_maximum.x|float / 2 %}
    {% set y_center = printer.toolhead.axis_maximum.y|float / 2 %}

    SET_GCODE_OFFSET Z=0                                    ; Clear any active Z offset
    SET_SKEW CLEAR=1                                        ; Ensure skew is off
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=bed_heating
    SET_DISPLAY_TEXT MSG="Scan Cal: Heating Bed {target_bed}c"

    G90                                                     ; Absolute positioning
    M107                                                    ; Turn off part-cooling fan
    SET_FAN_SPEED FAN=fan2 SPEED=0                          ; Ensure auxiliary fans are off
    SET_FAN_SPEED FAN=fan3 SPEED=0
    SET_FAN_SPEED FAN=fan4 SPEED=0

    M140 S{target_bed}                                      ; Start heating bed to 100C
    G28                                                     ; Home all axes
    G0 X{x_center} Y{y_center} Z50 F6000                    ; Drop bed to Z50 to shield nozzle & coil from radiant heat
    M190 S{target_bed}                                      ; Wait for bed to reach 100C

    SET_DISPLAY_TEXT MSG="Soaking 350 bed (2 min)..."
    G4 P120000                                              ; Allow 350mm plate thermal expansion to stabilize

    SET_DISPLAY_TEXT MSG="Leveling Gantry..."
    Z_TILT_ADJUST                                           ; Level the Trident gantry at operating temp
    G28 Z                                                   ; Re-home Z after leveling

    SET_DISPLAY_TEXT MSG="Ready for Scan Calibrate"
    SET_LED_EFFECT EFFECT=progress_bar
    G0 X{x_center} Y{y_center} Z10 F6000                    ; Move to center (175, 175) at safe 10mm height
    CARTOGRAPHER_SCAN_CALIBRATE                             ; Start Cartographer Scan calibration

[gcode_macro CALIBRATE_TOUCH]
description: Step 2 - Heat 350 bed to 100C safely, stabilize nozzle at 144C, wipe, and run Touch calibration
gcode:
    {% set target_bed = params.BED|default(100)|int %}
    {% set x_center = printer.toolhead.axis_maximum.x|float / 2 %}
    {% set y_center = printer.toolhead.axis_maximum.y|float / 2 %}

    SET_GCODE_OFFSET Z=0                                    ; Clear any active Z offset
    SET_SKEW CLEAR=1                                        ; Ensure skew is off
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=bed_heating
    SET_DISPLAY_TEXT MSG="Touch Cal: Heating Bed {target_bed}c"

    G90                                                     ; Absolute positioning
    M104 S140                                               ; Start preheating/cooling hotend toward 140C
    M140 S{target_bed}                                      ; Start heating bed to 100C
    G28                                                     ; Home all axes
    G0 X{x_center} Y{y_center} Z50 F6000                    ; Drop bed to Z50 so radiant heat doesn't overheat nozzle
    M190 S{target_bed}                                      ; Wait for bed to reach 100C

    SET_DISPLAY_TEXT MSG="Soaking 350 bed (2 min)..."
    G4 P120000                                              ; Allow 350mm plate thermal expansion to stabilize

    SET_DISPLAY_TEXT MSG="Stabilizing Nozzle 144c"
    SET_LED_EFFECT EFFECT=extruder_temp
    M106 S128                                               ; Run part fan at 50% to keep nozzle from creeping past 144C
    M109 R144                                               ; Wait for nozzle to heat OR cool to exactly 144C
    M107                                                    ; Turn off part fan

    SET_DISPLAY_TEXT MSG="Leveling Gantry..."
    Z_TILT_ADJUST                                           ; Level the Trident gantry at operating temp
    G28 Z                                                   ; Re-home Z after leveling

    SET_DISPLAY_TEXT MSG="Brushing Nozzle..."
    AFC_BRUSH                                               ; Wipe nozzle clean before tapping bed
    AFC_BRUSH

    SET_DISPLAY_TEXT MSG="Running Touch Calibrate"
    SET_LED_EFFECT EFFECT=progress_bar
    G0 X{x_center} Y{y_center} Z10 F6000                    ; Move to center (175, 175) at safe 10mm height
    CARTOGRAPHER_TOUCH_CALIBRATE                            ; Run Cartographer Touch calibration



