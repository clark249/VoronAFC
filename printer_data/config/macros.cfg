###### Save Touch Offset Macro

[gcode_macro SAVE_TOUCH_OFFSET]
description: Saves the baby-stepped Cartographer Touch offset permanently
gcode:
    Z_OFFSET_APPLY_PROBE
    SAVE_CONFIG

