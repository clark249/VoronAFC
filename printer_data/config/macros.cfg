##################################################################################################################################### 
#                  _____   ______ _____ __   _ _______      _______ _______ _______  ______ _______
#                 |_____] |_____/   |   | \  |    |         |______    |    |_____| |_____/    |
#                 |       |    \_ __|__ |  \_|    |         ______|    |    |     | |    \_    |
#
#####################################################################################################################################

[gcode_macro PRINT_START]
gcode:
  # Fetch data from your slicer
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}
  {% set initial_tool = params.TOOL|default("0")|int %}

  # 1. ALWAYS RESET GCODE OFFSET TO 0 AT THE START
  SET_GCODE_OFFSET Z=0                                  ; Reset Z offset for the new print

  # --- FIX START ---
  # Start cooling down/heating the hotend to 140C immediately so it has time to cool down to prevent the too hot from last print
  SET_DISPLAY_TEXT MSG="Preheating/Cooling Hotend to 140c: 140c"
  M104 S140                                             ; Set hotend to 140c without waiting yet
  # --- FIX END ---


  # Home the printer and clear old meshes
  #STATUS_HOMING                                        ; Set LEDs to homing-mode
  G28                                                   ; Full home (XYZ)
  G90                                                   ; Absolute positioning
  BED_MESH_CLEAR                                        ; Clear old saved bed mesh


  # Bed heating / heatsoak logic
  {% if params.BED|int > 90 %}
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"
    SET_LED_EFFECT EFFECT=bed_heating
    M106 S255                                           ; Turn on the PT-fan
    G1 X{x_wait} Y{y_wait} Z15 F9000                    ; Go to center of the bed
    M190 S{target_bed}                                  ; Wait for bed target temp
  {% else %}
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"
    SET_LED_EFFECT EFFECT=bed_heating
    G1 X{x_wait} Y{y_wait} Z15 F9000                    ; Go to center of the bed
    M190 S{target_bed}                                  ; Wait for bed target temp
    SET_DISPLAY_TEXT MSG="Soak for 1 min"
    G4 P60000                                           ; Wait 1 min for the bedtemp to stabilize (Note: Fixed from P6000 to P60000 for a true minute)
  {% endif %}

  # Heat hotend to 144c. Softens filament leftovers but stays safely below the 150c threshold.
  SET_DISPLAY_TEXT MSG="Hotend: 144c"
  M109 R144                                             ; Wait for hotend to reach 140c

  # Level the gantry (Trident Z_TILT_ADJUST)
  SET_DISPLAY_TEXT MSG="Leveling"
  #STATUS_LEVELING
  Z_TILT_ADJUST                                         ; Level the printer via Z_TILT_ADJUST
  G28 Z                                                 ; Home Z again after Z_TILT_ADJUST

  # Call the AFC brush macro to clean the nozzle before doing the Touch Calibration
  AFC_BRUSH
  AFC_BRUSH

  # 2. ESTABLISH TRUE Z=0 WITH THE NOZZLE TOUCH (Must happen before bed mesh)
  SET_DISPLAY_TEXT MSG="Calibrating Z Offset"
  CARTOGRAPHER_TOUCH_HOME                               ; Execute Cartographer Touch probing for real Z0

  # 3. BED MESH (Happens after Z is calibrated)
  SET_DISPLAY_TEXT MSG="Bed mesh"
  #STATUS_MESHING
  BED_MESH_CALIBRATE ADAPTIVE=1                         ; Start the adaptive bed mesh

  # Final nozzle heat up to target via data from slicer
  SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"
  SET_LED_EFFECT EFFECT=bed_heating
  M107                                                  ; Turn off partcooling fan
  M109 S{target_extruder}                               ; Heat the hotend to final printing temp
  T{initial_tool}                                       ; Load Initial Tool
  
  # Purge and clean macros
  SET_DISPLAY_TEXT MSG="Going to take a dump and then start..."
  SET_LED_EFFECT EFFECT=progress_bar
  G90                                                   ; Absolute positioning
  GOOSE_PURGE                                           ; Call your purge and clean macro

  # Start Print with Skew Profile
  #SKEW_PROFILE LOAD=Califlower

##################################################################################################################################### 
#                      _____   ______ _____ __   _ _______      _______ __   _ ______
#                     |_____] |_____/   |   | \  |    |         |______ | \  | |     \
#                     |       |    \_ __|__ |  \_|    |         |______ |  \_| |_____/
#                    
#####################################################################################################################################

[gcode_macro PRINT_END]
gcode:
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
    
    SET_SKEW CLEAR=1

    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    M400                           # wait for buffer to clear
    G92 E0                         # zero the extruder
    G1 E-20.0 F3600                # retract filament
    
    TURN_OFF_HEATERS
    
    G90                                                        # absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000                    # move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600  # park nozzle at rear
    M107                                                       # turn off fan
    SET_FAN_SPEED FAN=fan SPEED=0
    SET_FAN_SPEED FAN=fan2 SPEED=0
    SET_FAN_SPEED FAN=fan3 SPEED=0
    SET_FAN_SPEED FAN=fan4 SPEED=0

    BED_MESH_CLEAR
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=print_finished
    # The purpose of the SAVE_GCODE_STATE/RESTORE_GCODE_STATE
    # command pair is to restore the printer's coordinate system
    # and speed settings since the commands above change them.
    # However, to prevent any accidental, unintentional toolhead
    # moves when restoring the state, explicitly set MOVE=0.
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0

    # Automatically delete the file that just finished printing
    RUN_SHELL_COMMAND CMD=delete_current_gcode


##################################################################################################################################### 
#                          _____  _______ _     _ _______ _______
#                         |_____] |_____| |     | |______ |______
#                         |       |     | |_____| ______| |______
#                                        
#####################################################################################################################################

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
# change this if you need more or less extrusion
variable_extrude: 1.0
gcode:
  ##### read E from pause macro #####
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  ##### set park positon for x and y #####
  # default is your max posion from your printer.cfg
  {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
  {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
  ##### calculate save lift position #####
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z < (max_z - 2.0) %}
      {% set z_safe = 2.0 %}
  {% else %}
      {% set z_safe = max_z - act_z %}
  {% endif %}
  ##### end of definitions #####
  PAUSE_BASE
  G91
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G1 E-{E} F2100
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}
  {% if "xyz" in printer.toolhead.homed_axes %}
    G1 Z{z_safe} F900
    G90
    G1 X{x_park} Y{y_park} F6000
  {% else %}
    {action_respond_info("Printer not homed")}
  {% endif %} 
  
##################################################################################################################################### 
#                           ______ _______ _______ _     _ _______ _______
#                          |_____/ |______ |______ |     | |  |  | |______
#                          |    \_ |______ ______| |_____| |  |  | |______
#                                        
#####################################################################################################################################

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  #### get VELOCITY parameter if specified ####
  {% if 'VELOCITY' in params|upper %}
    {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
  {%else %}
    {% set get_params = "" %}
  {% endif %}
  ##### end of definitions #####
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G1 E{E} F2100
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}  
  RESUME_BASE {get_params}
  
##################################################################################################################################### 
#                            _______ _______ __   _ _______ _______
#                            |       |_____| | \  | |       |______ |
#                            |_____  |     | |  \_| |_____  |______ |_____
#                                        
#####################################################################################################################################

[gcode_macro CANCEL_PRINT]
# Defines a G-code macro to cancel the actual running print
description = Cancel the actual running print
rename_existing = CANCEL_PRINT_BASE
variable_park = True
gcode = 
    G28 Y                                     # Home Y axis
    _TOOLHEAD_PARK_PAUSE_CANCEL               # Call _TOOLHEAD_PARK_PAUSE_CANCEL macro
    TURN_OFF_HEATERS                          # Turn off all heaters
    CANCEL_PRINT_BASE                         # Call CANCEL_PRINT_BASE to cancel print
    SET_FAN_SPEED FAN=fan SPEED=0
    SET_FAN_SPEED FAN=fan2 SPEED=0
    SET_FAN_SPEED FAN=fan3 SPEED=0
    SET_FAN_SPEED FAN=fan4 SPEED=0


##################################################################################################################################### 
#                                _____         _______ _____        _______ 
#                                   /    _____    |      |   |         |    
#                                  /____          |    __|__ |_____    |    
#                                                                           
#####################################################################################################################################


[gcode_macro Z_TILT_ADJUST]     # IDM/Cartographer optimized 3Z leveling macro
rename_existing: _Z_TILT_ADJUST
gcode:
    SAVE_GCODE_STATE NAME=STATE_Z_TILT         # Save current state for Z tilt adjustment
    BED_MESH_CLEAR                             # Clear bed mesh
    {% if not printer.z_tilt.applied %}
      _Z_TILT_ADJUST horizontal_move_z=10 retry_tolerance=1   # Adjust Z tilt with higher tolerance initially
    {% endif %}
    _Z_TILT_ADJUST horizontal_move_z=2          # Fine-tune Z tilt adjustment
    RESTORE_GCODE_STATE NAME=STATE_Z_TILT       # Restore saved state after adjustment

[gcode_macro LOAD_FILAMENT]
variable_load_distance:  50
variable_purge_distance:  25
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity  * 60 %}
    SAVE_GCODE_STATE NAME=load_state
    G91
    G92 E0
    G1 E{load_distance} F{max_velocity} # fast-load
    G1 E{purge_distance} F{speed} # purge
    RESTORE_GCODE_STATE NAME=load_state

[gcode_macro UNLOAD_FILAMENT]
variable_unload_distance:  50
variable_purge_distance:  25
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity  * 60 %}
    SAVE_GCODE_STATE NAME=unload_state
    G91
    G92 E0
    G1 E{purge_distance} F{speed} # purge
    G1 E-{unload_distance} F{max_velocity} # fast-unload
    RESTORE_GCODE_STATE NAME=unload_state

