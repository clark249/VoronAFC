[gcode_macro G32]
description: Clear mesh, home, level Trident gantry, and park at center
gcode:
    BED_MESH_CLEAR                                          ; Clear bed mesh
    G28                                                     ; Home all axes
    Z_TILT_ADJUST                                           ; Perform gantry leveling
    G28 Z                                                   ; Re-home Z only after leveling
    G0 X175 Y175 Z30 F6000                                  ; Park at Trident 350 center

#--------------------------------------------------------------------
[gcode_macro DRAW_LINES]
description: Safe manual two-pass purge line along front edge
gcode:
    SAVE_GCODE_STATE NAME=DRAW_LINES_STATE
    G90                                                     ; Absolute positioning
    M83                                                     ; Relative extruder mode
    G1 Z5.0 F3000                                           ; Safe Z travel lift
    G1 X50 Y5 F7200                                         ; Move to front-left start position (clears edge/clips)
    G1 Z0.28 F1500                                          ; Lower to first-layer height
    G1 X200 Y5 Z0.28 E12 F1500                              ; Draw first 150mm line
    G1 X200 Y5.4 Z0.28 F5000                                ; Shift over 0.4mm
    G1 X55 Y5.4 Z0.28 E12 F1500                             ; Draw second 145mm line
    G1 E-0.4 F1800                                          ; Small retract to prevent stringing
    G1 Z2.0 F3000                                           ; Lift Z cleanly
    RESTORE_GCODE_STATE NAME=DRAW_LINES_STATE




