#                 |_____] |_____/   |   | \  |    |         |______    |    |_____| |_____/    |
#                 |       |    \_ __|__ |  \_|    |         ______|    |    |     | |    \_    |
#
#####################################################################################################################################

[gcode_macro PRINT_START]
gcode:
  # Fetch data from slicer
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set initial_tool = params.TOOL|default(0)|int %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

  # 1. Reset Z offset and start preheating/cooling hotend to 140C
  SET_GCODE_OFFSET Z=0
  SET_DISPLAY_TEXT MSG="Hotend preheat: 140c"
  M104 S140

  STOP_LED_EFFECTS
  SET_LED_EFFECT EFFECT=extruder_temp

  # 2. Home and clear old mesh
  G28
  G90
  BED_MESH_CLEAR

  # 3. Bed heating (circulate air for high-temp filaments like ABS/ASA)
  SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"
  SET_LED_EFFECT EFFECT=bed_heating
  G1 X{x_wait} Y{y_wait} Z15 F9000
  {% if target_bed > 90 %}
    M106 S255                                           ; Circulate chamber air with part fan
    M190 S{target_bed}
  {% else %}
    M107                                                ; Ensure part fan is off for low-temp beds
    M190 S{target_bed}
  {% endif %}

  # 4. Stabilize nozzle at 144C (softens ooze without triggering Cartographer >150C limit)
  SET_DISPLAY_TEXT MSG="Hotend: 144c"
  M109 R144

  # 5. Level gantry and re-home Z
  SET_DISPLAY_TEXT MSG="Leveling"
  Z_TILT_ADJUST
  G28 Z

  # 6. Brush nozzle clean right before Cartographer Touch
  AFC_BRUSH
  AFC_BRUSH

  # 7. Establish true Z=0 with Cartographer Touch
  SET_DISPLAY_TEXT MSG="Calibrating Z Offset"
  G1 X{x_wait} Y{y_wait} Z10 F9000
  CARTOGRAPHER_TOUCH_HOME

  # 8. Adaptive Bed Mesh
  SET_DISPLAY_TEXT MSG="Bed mesh"
  BED_MESH_CALIBRATE ADAPTIVE=1

  # 9. Heat hotend to final printing temp & load starting AFC lane
  SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"
  SET_LED_EFFECT EFFECT=extruder_temp
  M107                                                  ; Turn off part-cooling fan
  M109 S{target_extruder}
  T{initial_tool}                                       ; Load initial tool (skips if already loaded)

  # 10. Purge on Goose Belt Purger
  SET_DISPLAY_TEXT MSG="Purging..."
  SET_LED_EFFECT EFFECT=progress_bar
  G90
  GOOSE_PURGE

  # 11. Short front-edge test line for visual first-layer check
  SET_DISPLAY_TEXT MSG="Test line..."
  G90                                                   ; Absolute positioning
  M83                                                   ; Relative extruder mode
  G1 Z5.0 F3000                                         ; Safe Z travel height
  G1 X20 Y5 F9000                                       ; Move to front-left start position
  G1 Z0.25 F1500                                        ; Drop to first-layer check height
  G1 X80 E6 F1500                                       ; Lay down a short 60mm test line
  G1 E-0.4 F1800                                        ; Tiny retract to prevent stringing
  G1 Z2.0 F3000                                         ; Lift Z cleanly before moving to print


  # Start Print with Skew Profile
  #SKEW_PROFILE LOAD=Califlower

##################################################################################################################################### 
#                      _____   ______ _____ __   _ _______      _______ __   _ ______
#                     |_____] |_____/   |   | \  |    |         |______ | \  | |     \
#                     |       |    \_ __|__ |  \_|    |         |______ |  \_| |_____/
#                    
#####################################################################################################################################

[gcode_macro PRINT_END]
gcode:
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 10, th.axis_maximum.z]|min %}

    SET_SKEW CLEAR=1
    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    M400                                                        ; Wait for buffer to clear
    M83                                                         ; Relative extruder mode
    G1 E-2.0 F1800                                              ; Short retract (keeps filament seated for AFC)

    TURN_OFF_HEATERS

    G90                                                         ; Absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000                     ; Wipe and lift Z to prevent stringing
    G0 X{th.axis_maximum.x // 2} Y{th.axis_maximum.y - 5} F6000 ; Park toolhead safely at rear

    M107                                                        ; Turn off part-cooling fan
    SET_FAN_SPEED FAN=fan2 SPEED=0
    SET_FAN_SPEED FAN=fan3 SPEED=0

    BED_MESH_CLEAR
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=print_finished
    SET_DISPLAY_TEXT MSG="Print Complete"

    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0

    # Automatically delete the file that just finished printing
    RUN_SHELL_COMMAND CMD=delete_current_gcode



##################################################################################################################################### 
#                          _____  _______ _     _ _______ _______
#                         |_____] |_____| |     | |______ |______
#                         |       |     | |_____| ______| |______
#                                        
#####################################################################################################################################

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
variable_extrude: 1.0
gcode:
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  # Park coordinates (change to your Goose purger X/Y if preferred)
  {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
  {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
  # Calculate safe 10mm Z lift
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% set z_safe = [10.0, max_z - act_z]|min %}

  SAVE_GCODE_STATE NAME=PAUSE_STATE
  PAUSE_BASE
  SET_IDLE_TIMEOUT TIMEOUT=43200                        ; Keep bed warm for up to 12 hours while paused
  SET_DISPLAY_TEXT MSG="Print Paused"
  STOP_LED_EFFECTS
  SET_LED_EFFECT EFFECT=bed_heating

  G91
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G1 E-{E} F2100                                      ; Short 1mm retract (AFC-safe)
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}

  {% if "xyz" in printer.toolhead.homed_axes %}
    G1 Z{z_safe} F900
    G90
    G1 X{x_park} Y{y_park} F6000
  {% else %}
    {action_respond_info("Printer not homed")}
  {% endif %}

  
##################################################################################################################################### 
#                           ______ _______ _______ _     _ _______ _______
#                          |_____/ |______ |______ |     | |  |  | |______
#                          |    \_ |______ ______| |_____| |  |  | |______
#                                        
#####################################################################################################################################

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  {% if 'VELOCITY' in params|upper %}
    {% set get_params = ('VELOCITY=' + params.VELOCITY) %}
  {% else %}
    {% set get_params = "" %}
  {% endif %}

  # Optional: wipe nozzle on AFC brush before returning to print
  # AFC_BRUSH

  SET_IDLE_TIMEOUT TIMEOUT=600                          ; Restore normal 10-minute idle timeout
  SET_DISPLAY_TEXT MSG="Resuming print..."
  STOP_LED_EFFECTS
  SET_LED_EFFECT EFFECT=progress_bar

  # Return toolhead to exact pre-pause position first
  RESTORE_GCODE_STATE NAME=PAUSE_STATE MOVE=1 MOVE_SPEED=150

  # Prime the 1.0mm retraction once back at the print position
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G1 E{E} F2100
    G90
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}

  RESUME_BASE {get_params}

  
##################################################################################################################################### 
#                            _______ _______ __   _ _______ _______
#                            |       |_____| | \  | |       |______ |
#                            |_____  |     | |  \_| |_____  |______ |_____
#                                        
#####################################################################################################################################

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
   TURN_OFF_HEATERS
   CANCEL_PRINT_BASE

   SET_IDLE_TIMEOUT TIMEOUT=600                          ; Restore normal 10-minute idle timeout

  {% set th = printer.toolhead %}
  {% set z_safe = [th.position.z + 10.0, th.axis_maximum.z]|min %}
  
  #SET_SKEW CLEAR=1

  # Short AFC-safe retract if hotend is at temp
  {% if printer.extruder.can_extrude|lower == 'true' %}
    M83
    G1 E-2.0 F1800
  {% endif %}

    # Lift Z safely BEFORE moving XY so nozzle never hits the print
  {% if "xyz" in th.homed_axes %}
    G90
    G0 Z{z_safe} F3000
    G0 X{th.axis_maximum.x // 2} Y{th.axis_maximum.y - 5} F6000
  {% endif %}

  M107                                                  ; Turn off part-cooling fan
  SET_FAN_SPEED FAN=fan2 SPEED=0
  SET_FAN_SPEED FAN=fan3 SPEED=0


  BED_MESH_CLEAR
  STOP_LED_EFFECTS
  SET_LED_EFFECT EFFECT=extruder_temp
  SET_DISPLAY_TEXT MSG="Print Cancelled"

 

