#sensor_pin: EBBCan:gpio28               # Sensor pin

[temperature_sensor BTT-MCU]                # BTT-MCU temperature sensor configuration       
sensor_type: temperature_mcu            # Sensor type

[temperature_sensor CM4]                # BTT-PI temperature sensor configuration
sensor_type: temperature_host           # Sensor type

[temperature_sensor AFC-Stepper]
sensor_type: Generic 3950    # Change this if you are using a different thermistor (e.g., EPCOS 100K)
sensor_pin: Turtle_1:PC0     # Replace 'PA5' with the specific ADC/thermistor pin of your V3 board
min_temp: 0
max_temp: 300     


##################################################################################################################################### 
#                          _____   ______ _____ __   _ _______ _______  ______
