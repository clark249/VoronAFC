#########################################################################################
##                       Voron 350                                                     ##
##                Cartographer V4 Included                                             ##
##                  With AFC-Lite Install                                              ## 
##                  Extractor Fan Installed                                            ##  
##             Switch to Dragon Burner EBB36 V1.2.1                                    ## 
##                       Updated 03 Jun 26                                             ##
##             Stepper currents reduced after TMC Error from 1.5 to 1.1                ##
#########################################################################################

[save_variables]
filename: ~/printer_data/config/variables.cfg

[respond]
default_type: echo
default_prefix: echo:

##################################################################################################################################### 
#                   _____ __   _ _______        _     _ ______  _______
#                     |   | \  | |       |      |     | |     \ |______
#                   __|__ |  \_| |_____  |_____ |_____| |_____/ |______
#
#####################################################################################################################################   

[include mainsail.cfg]  # Include configuration from mainsail.cfg file
[include fans.cfg] 
[include goose_belt.cfg]
[include led_effects.cfg]
#[include ServiceSettings.cfg]
[include macros.cfg]
[include ServiceMacros.cfg]
#[include timelapse.cfg]
[include AFC/*.cfg]

##################################################################################################################################### 
#                   _______  _____  __   _ _______  ______  _____         _______
#                   |       |     | | \  |    |    |_____/ |     | |      |______
#                   |_____  |_____| |  \_|    |    |    \_ |_____| |_____ ______|
#
##################################################################################################################################### 
[virtual_sdcard]
path: /home/pi/printer_data/gcodes    # Path to the virtual SD card directory
on_error_gcode: CANCEL_PRINT            # G-code to execute on error (defined in CANCEL_PRINT macro)

[gcode_arcs]
resolution: 0.1                         # Arc interpolation resolution, handles G2/G3 commands

[force_move]
enable_force_move: true                 # Enable force move feature

# [skew_correction]                       # Test shows -0.13 NO NEED FOR SKEW CORRECTION ON THIS PRINTER
[exclude_object]

##################################################################################################################################### 
#            _______ _______ _______  ______  _____   ______  ______ _______  _____  _     _ _______  ______
#            |       |_____|    |    |_____/ |     | |  ____ |_____/ |_____| |_____] |_____| |______ |_____/
#            |_____  |     |    |    |    \_ |_____| |_____| |    \_ |     | |       |     | |______ |    \_                 
#
#####################################################################################################################################   

[mcu cartographer] # See https://www.klipper3d.org/Config_Reference.html#mcu
# Remove either the serial or canbus_uuid line dependant on your setup.
canbus_uuid: 19af54ead68c    # Old Fucked Carto V4 d6d6aab94a04 

[cartographer]
mcu: cartographer
x_offset: 0 # This is the offset of your probe from the nozzle tip, to the centre of the coil.
y_offset: 23 # This is the offset of your probe from the nozzle tip, to the centre of the coil.

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: -100
max_temp: 105

[adxl345]
cs_pin: cartographer:PA3
spi_bus: spi1
cs_pin: cartographer:PA3 # For Cartographer V3
cs_pin: cartographer:PA0 # For Cartographer V4


[resonance_tester]
accel_chip: adxl345
probe_points:
    175, 175, 20 # Fill out the blank with x and y coordinates where you want to run the resonance test.

##################################################################################################################################### 
#                     ______  _______ ______       _______ _______ _______ _     _
#                     |_____] |______ |     \      |  |  | |______ |______ |_____|
#                     |_____] |______ |_____/      |  |  | |______ ______| |     |     
#
#####################################################################################################################################  

[bed_mesh]
zero_reference_position: 175,175  
#    This option is suitable for the 350 model. 
#    set this to the middle of your bed
speed: 300           #    movement speed of toolhead during bed mesh
horizontal_move_z: 3 #    height of scanner during bed mesh scan
mesh_min: 30, 30     #    start point of bed mesh [X, Y]
mesh_max: 320, 320   #    end point of bed mesh [X, Y]
probe_count: 30, 30
mesh_pps: 0,0        # Disable interpolation - mesh is probably dense enough
algorithm: bicubic


